# Netlify configuration file for Truyen24h.vn

[build]
  command = "npm run build"
  publish = ".next"

[functions]
  directory = "netlify/functions"
  node_bundler = "nft"
  # Set function timeout configuration (maximum allowed on Netlify plans)
  timeout = 60

# Daily Run Cron Scheduled Function configuration
[functions."daily-run-cron"]
  schedule = "0 1 * * *"
